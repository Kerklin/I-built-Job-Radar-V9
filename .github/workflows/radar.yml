# Job Radar V9 - GitHub schedule. Must live at: .github/workflows/radar.yml
# Uses NO GitHub "actions" at all (no checkout, no upload-artifact, no setup-python),
# so there is nothing that can run on Node.js 20 or 24. Only git + Python 3 already on the runner.
name: Job Radar
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch:             # "Run workflow" button
permissions:
  contents: write
concurrency:
  group: job-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get code (plain git)
        env:
          TOKEN: ${{ github.token }}
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Self-tests (stop here if anything is broken)
        run: python3 radar.py --test
      - name: Collect jobs
        run: |
          python3 radar.py
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish web page
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jobs.json .nojekyll
          git diff --cached --quiet && exit 0
          git commit -q -m "radar $(date -u +%F_%H%M)"
          git pull -q --rebase && git push -q
